<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        if (localStorage.theme === 'dark' ||
            (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - e-NABLE UIUC</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FF5F05;
            --text-primary: #121212;
            --glass-light: rgba(255, 255, 255, 0.85);
            --glass-text: #121212;
            --border-light: rgba(0, 0, 0, 0.1);
            --accent-color: #13294B;

            --bg-primary-dark: #13294B;
            --text-primary-dark: #f8f9fa;
            --glass-dark: #13294B;
            --glass-text-dark: #f8f9fa;
            --border-dark: rgba(255, 255, 255, 0.15);
            --accent-color-dark: #FF5F05;
        }

        .dark-theme {
            --bg-primary: var(--bg-primary-dark);
            --text-primary: var(--text-primary-dark);
            --glass-light: var(--glass-dark);
            --glass-text: var(--glass-text-dark);
            --border-light: var(--border-dark);
            --accent-color: var(--accent-color-dark);
        }

        body {
            font-family: 'DM Mono', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.5s ease, color 0.3s ease;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.05"/></svg>');
            line-height: 1.6;
        }

        header,
        .gallery-item,
        footer {
            background: var(--glass-light) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-color: var(--border-light) !important;
            color: var(--glass-text) !important;
        }

        header {
            border-bottom: 1px solid var(--border-light);
        }

        nav a {
            color: var(--glass-text);
            transition: all 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        #theme-toggle {
            background: var(--glass-light);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            transition: all 0.3s ease;
        }

        #theme-toggle:hover {
            transform: scale(1.5);
        }

        #nav-menu.hidden {
            display: none;
        }

        #nav-menu {
            display: flex;
        }

        main {
            margin-top: 80px;
            padding: 2rem;
        }
    </style>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
    <header class="fixed top-0 z-50 w-full py-4">
        <div class="container flex items-center justify-between px-4 mx-auto">
            <h1 class="text-2xl font-semibold">e-NABLE @ UIUC</h1>
            <div class="md:hidden">
                <button id="nav-toggle" class="focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                    </svg>
                </button>
            </div>
            <nav id="nav-menu" class="md:flex md:space-x-6">
                <ul class="flex flex-col items-center space-y-4 md:flex-row md:space-y-0 md:space-x-6">
                    <li><a href="/index.html">home</a></li>
                    <li><a href="/contact.html">contact</a></li>
                    <li><a href="/about.html">about</a></li>
                    <li>
                        <button id="theme-toggle" class="p-2 rounded-full">
                            <span class="light-icon">🌞</span>
                            <span class="hidden dark-icon">🌙</span>
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h2 class="mb-8 text-4xl font-bold">About e-NABLE @ UIUC</h2>
        <div class="max-w-2xl p-8 rounded-lg glass">
            <p class="mb-4 text-lg">Learn more about our mission and team</p>
        </div>
    </main>

    <script>
        const navToggle = document.getElementById('nav-toggle');
        const navMenu = document.getElementById('nav-menu');

        navToggle.addEventListener('click', () => {
            navMenu.classList.toggle('hidden');
        });

        const themeToggle = document.getElementById('theme-toggle');
        const darkIcon = document.querySelector('.dark-icon');
        const lightIcon = document.querySelector('.light-icon');

        const savedTheme = localStorage.getItem('theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

        if (savedTheme === 'dark') document.documentElement.classList.add('dark-theme');

        function updateIcons() {
            const isDark = document.documentElement.classList.contains('dark-theme');
            darkIcon.classList.toggle('hidden', !isDark);
            lightIcon.classList.toggle('hidden', isDark);
        }

        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark-theme');
            const theme = document.documentElement.classList.contains('dark-theme') ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
            updateIcons();
        });

        updateIcons();
    </script>
</body>

</html>
