        :root {

            --bg-primary: #FF5F05;
            --text-primary: #121212;

            --glass-text: var(--glass-text-dark);

            --accent-color: var(--accent-color-dark);
        }

            flex-shrink: 0;
            margin-bottom: 50px;

            min-height: 100vh;
            font-family: 'DM Mono', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.5s ease, color 0.3s ease;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.05"/></svg>');
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        /* Glassmorphism Navigation Bar */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--glass-light) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            color: var(--glass-text) !important;
            z-index: 100;
            padding: 1rem 0;
        }

        /* Navigation */
        nav a {
            color: var(--glass-text);
            transition: all 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        /* Theme toggle button */
        #theme-toggle {
            background: var(--glass-light);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            transition: all 0.3s ease;
        }

        #theme-toggle:hover {
            transform: scale(1.1);
        }

        /* Contact Section */
        #contact {
            padding: 8rem 0 4rem;
            /* Adjusted for fixed header */
        }

        .contact-container {
            background: var(--glass-light);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .email-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .email-link:hover {
            text-decoration: underline;
            transform: translateY(-2px);
        }

        /* Dropdown menu */
        .desktop-dropdown-menu {
            margin-top: 0.5rem;
            background: var(--glass-light);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .desktop-dropdown:hover .desktop-dropdown-menu {
            display: block;
        }



        @media (max-width: 768px) {
            #contact {
                padding: 6rem 0 2rem;
            }

            .contact-container {
                margin: 0 1rem;
                padding: 1.5rem;
            }

            #nav-menu.hidden {
                display: none;
            }

            #nav-menu.shown {
                display: flex;
            }

            #nav-menu {
                display: none;
            }

            #nav-menu {
                background: var(--glass-light);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid var(--border-light);
                border-radius: 8px;
                padding: 1rem;
                margin-top: 0.5rem;
            }
        }
    </style>

    <script>
        const navToggle = document.getElementById('nav-toggle');
        const navMenu = document.getElementById('nav-menu');

        navToggle.addEventListener('click', () => {
            navMenu.classList.toggle('shown');
        });

        const themeToggle = document.getElementById('theme-toggle');
        const darkIcon = document.querySelector('.dark-icon');
        const lightIcon = document.querySelector('.light-icon');

        const savedTheme = localStorage.getItem('theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

        if (savedTheme === 'dark') document.documentElement.classList.add('dark-theme');

        function updateIcons() {
            const isDark = document.documentElement.classList.contains('dark-theme');
            darkIcon.classList.toggle('hidden', !isDark);
            lightIcon.classList.toggle('hidden', isDark);
        }

        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark-theme');
            const theme = document.documentElement.classList.contains('dark-theme') ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
            updateIcons();
        });

        updateIcons();
    </script>
